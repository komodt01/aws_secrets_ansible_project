---
- name: Retrieve secret from AWS Secrets Manager
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Retrieve secret value
      amazon.aws.aws_secret:
        name: ansible-secret
        region: us-east-1
      register: secret_result
      no_log: true

    - name: Confirm successful secret retrieval
      ansible.builtin.debug:
        msg: "Secret retrieved successfully without exposing its value."
